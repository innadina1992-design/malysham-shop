<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Малышам — магазин</title><script src="https://st.max.ru/js/max-web-app.js"></script><style>body{font:16px system-ui;background:#faf5ef;color:#59483e;margin:0}.wrap{max-width:620px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}small{color:#937c6e}.hero{background:#e8d9ca;padding:24px;border-radius:18px;margin:20px 0}button{background:#866a59;color:white;border:0;border-radius:12px;padding:11px 14px;cursor:pointer}button.secondary{background:#e8d9ca;color:#59483e}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.tabs button{white-space:nowrap}.item{background:white;padding:15px;margin:10px 0;border-radius:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}.price{font-weight:700;margin-top:7px}.hidden{display:none}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d9c9bd;border-radius:10px;font:inherit}label{display:block;margin-top:7px}.sum{font-size:20px;font-weight:bold}footer{position:sticky;bottom:0;background:#faf5ef;padding:10px 0}.qty{display:flex;gap:8px;align-items:center}</style></head><body><div class="wrap"><header><div><h1>Малышам 🤍</h1><small>Студия детского текстиля · Уссурийск</small></div><button class="secondary" onclick="show('basket')">Корзина <span id="count">0</span></button></header><div id="catalog"><div class="hero"><h2>С любовью к самым маленьким</h2><p>Наборы на выписку, текстиль для кроватки и уютные подарки.</p></div><div class="tabs" id="tabs"></div><div id="products"></div></div><div id="basket" class="hidden"><h2>Ваша корзина</h2><div id="lines"></div><p class="sum" id="sum"></p><button class="secondary" onclick="show('catalog')">← К товарам</button><h2>Оформление заказа</h2><form id="checkout"><label>Ваше имя<input name="name" required maxlength="100"></label><label>Телефон<input name="phone" type="tel" required maxlength="30"></label><label>Получение<select name="delivery" id="delivery"><option value="cdek">СДЭК</option><option value="post">Почта России</option><option value="pickup">Самовывоз, Уссурийск</option></select></label><label>Город, адрес или пункт выдачи<textarea name="address" id="address" rows="2" required></textarea></label><label>Оплата<select name="payment"><option value="after_confirmation">После подтверждения менеджером</option><option value="online">Онлайн после расчёта доставки</option></select></label><label>Пожелания к цвету, размеру, заказу<textarea name="comment" rows="2" maxlength="1000"></textarea></label><label><input type="checkbox" id="consent" required style="width:auto"> Согласен(на) на обработку данных для оформления заказа</label><button type="submit">Подготовить заказ</button><p id="result" role="status"></p></form></div><footer><small>Демонстрационный прототип. Оплата и отправка заказа на сервер ещё не подключены.</small></footer></div><script>
const products=[{id:1,name:'Набор на выписку «Осень»',price:4000,cat:'На выписку'},{id:2,name:'Набор на выписку «Зима»',price:5300,cat:'На выписку'},{id:3,name:'Бортики + простынь',price:4500,cat:'В кроватку'},{id:4,name:'Плед плюшевый 100×120',price:900,cat:'Пледы'},{id:5,name:'Простынь на резинке',price:600,cat:'Постельное бельё'},{id:6,name:'Пелёнка ранфорс',price:300,cat:'Пелёнки'}];let cart={};let cat='Все';const money=n=>n.toLocaleString('ru-RU')+' ₽';function show(page){document.getElementById('catalog').classList.toggle('hidden',page!=='catalog');document.getElementById('basket').classList.toggle('hidden',page!=='basket');render();window.scrollTo(0,0)}function change(id,delta){cart[id]=Math.max(0,(cart[id]||0)+delta);render()}function render(){document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('tabs').innerHTML=['Все',...new Set(products.map(p=>p.cat))].map(c=>`<button class="${cat===c?'':'secondary'}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});document.getElementById('products').innerHTML=products.filter(p=>cat==='Все'||p.cat===cat).map(p=>`<div class="item"><div><b>${p.name}</b><div class="price">${money(p.price)}</div></div><div class="qty"><button class="secondary" onclick="change(${p.id},-1)">−</button><span>${cart[p.id]||0}</span><button onclick="change(${p.id},1)">+</button></div></div>`).join('');document.getElementById('lines').innerHTML=products.filter(p=>cart[p.id]>0).map(p=>`<div class="item">${p.name} × ${cart[p.id]}<b>${money(p.price*cart[p.id])}</b></div>`).join('')||'<p>Корзина пуста</p>';document.getElementById('sum').textContent='Товары: '+money(products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0))+' + доставка';}document.getElementById('delivery').onchange=e=>{let pickup=e.target.value==='pickup';document.getElementById('address').required=!pickup;document.getElementById('address').disabled=pickup};document.getElementById('checkout').onsubmit=e=>{e.preventDefault();if(!Object.values(cart).some(Boolean)){alert('Добавьте товар в корзину');return}let data=Object.fromEntries(new FormData(e.target));let order={items:products.filter(p=>cart[p.id]).map(p=>({id:p.id,quantity:cart[p.id]})),customer:data,subtotal:products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0)};document.getElementById('result').textContent='Тестовый заказ сформирован. Для реальной отправки требуется сервер. Данные заказа не отправлены.';console.log('DEMO ORDER (local only)',{items:order.items,subtotal:order.subtotal});};render();</script></body></html>
